<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquidify — Complete Shopify Store in TSX</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f7fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e111b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Build a complete Shopify store in TSX and compile it to Liquid. Documentation, examples, and a working template."
    />
    <link rel="canonical" href="https://levi5.github.io/liquidify/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Liquidify" />
    <meta property="og:title" content="Liquidify — Complete Shopify Store in TSX" />
    <meta
      property="og:description"
      content="Write Shopify sections and snippets in TSX and compile to Liquid with schema, stylesheet, and bundles generated together."
    />
    <meta property="og:url" content="https://levi5.github.io/liquidify/" />
    <meta property="og:image" content="https://levi5.github.io/liquidify/assets/logo-mark.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Liquidify — Complete Shopify Store in TSX" />
    <meta
      name="twitter:description"
      content="Write Shopify sections and snippets in TSX and compile to Liquid with schema, stylesheet, and bundles generated together."
    />
    <meta name="twitter:image" content="https://levi5.github.io/liquidify/assets/logo-mark.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Liquidify",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "TSX to Shopify Liquid compiler with Babel and esbuild. Write theme sections and snippets in TSX.",
        "url": "https://levi5.github.io/liquidify/",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
    <script
      defer
      data-domain="levi5.github.io/liquidify"
      src="https://plausible.io/js/script.js"
    ></script>
  </head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("liquidify-docs-theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
           document.documentElement.dataset.theme = dark ? "dark" : "light";
           document.documentElement.lang = localStorage.getItem("liquidify-docs-locale") === "pt-BR" ? "pt-BR" : "en";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
